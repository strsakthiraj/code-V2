<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SympoFlow - Registration Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Modern Base Styles */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f1f5f9; margin: 0; padding: 20px; color: #1e293b; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
        .form-card { background: #ffffff; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 480px; }
        h2 { margin-top: 0; color: #2563eb; font-size: 24px; text-align: center; margin-bottom: 25px; }
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #475569; }
        .input-group input { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 15px; transition: border 0.2s; }
        .input-group input:focus { outline: none; border-color: #2563eb; }
        .submit-btn { width: 100%; background: #2563eb; color: #ffffff; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .submit-btn:hover { background: #1d4ed8; }
        .submit-btn:disabled { background: #94a3b8; cursor: not-allowed; }
        
        /* Toast Popup Styles */
        .toast-msg { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #ffffff; padding: 14px 24px; border-radius: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); font-size: 14px; text-align: center; transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 10000; pointer-events: none; max-width: 90%; }
        .toast-msg.show { bottom: 30px; }

        /* Floating Q&A Layout Configurations */
        .qa-widget { position: fixed; bottom: 25px; right: 25px; z-index: 9999; }
        .qa-toggle-btn { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #4f46e5, #2563eb); color: #ffffff; border: none; font-size: 26px; cursor: pointer; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
        .qa-toggle-btn:hover { transform: scale(1.08); }
        .qa-container { position: absolute; bottom: 75px; right: 0; width: 340px; max-height: 450px; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); display: flex; flex-direction: column; overflow: hidden; transform: translateY(20px) scale(0.95); opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .qa-widget.active .qa-container { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }
        .qa-header { background: linear-gradient(135deg, #4f46e5, #2563eb); color: #ffffff; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .qa-header h3 { margin: 0; font-size: 14px; }
        .qa-close-btn { background: none; border: none; color: #ffffff; font-size: 22px; cursor: pointer; }
        .qa-content { flex: 1; padding: 15px; overflow-y: auto; background: #f8fafc; display: flex; flex-direction: column; gap: 10px; }
        .qa-item { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; }
        .qa-question { width: 100%; background: none; border: none; padding: 12px; text-align: left; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; justify-content: space-between; }
        .qa-answer { max-height: 0; overflow: hidden; padding: 0 12px; font-size: 12px; color: #64748b; transition: all 0.25s ease-out; }
        .qa-item.open .qa-answer { padding: 0 12px 12px 12px; max-height: 200px; }

        @media screen and (max-width: 480px) {
            .qa-widget { bottom: 15px; right: 15px; }
            .qa-toggle-btn { width: 50px; height: 50px; font-size: 22px; }
            .qa-container { bottom: 65px; width: calc(100vw - 30px); max-height: 380px; }
        }
    </style>
</head>
<body>

    <div class="form-card">
        <h2><i class="fa-solid fa-graduation-cap"></i> Student Registration</h2>
        <form id="form">
            <div class="input-group"><label>Full Name</label><input type="text" id="name" required placeholder="John Doe"></div>
            <div class="input-group"><label>Email Address</label><input type="email" id="email" required placeholder="john@example.com"></div>
            <div class="input-group"><label>Phone Number</label><input type="tel" id="phone" required placeholder="9876543210"></div>
            <div class="input-group"><label>College Name</label><input type="text" id="college" required placeholder="ABC Institute"></div>
            <div class="input-group"><label>Department</label><input type="text" id="department" required placeholder="Computer Science"></div>
            <div class="input-group"><label>Year of Study</label><input type="text" id="year" required placeholder="III Year"></div>
            <button type="submit" class="submit-btn" id="submitBtn"><i class="fa-solid fa-paper-plane"></i> Register</button>
        </form>
    </div>

    <!-- Floating Q&A Widget -->
    <div class="qa-widget" id="qaWidget">
        <button class="qa-toggle-btn" onclick="toggleQAWidget()"><i class="fa-solid fa-circle-question"></i></button>
        <div class="qa-container">
            <div class="qa-header">
                <h3><i class="fa-solid fa-comments"></i> Frequently Asked Questions</h3>
                <button class="qa-close-btn" onclick="toggleQAWidget()">&times;</button>
            </div>
            <div class="qa-content" id="qaContent"><div style="text-align:center; font-size:12px; padding:15px; color:#64748b;">Loading questions...</div></div>
        </div>
    </div>

    <div id="toast" class="toast-msg"></div>

    <script src="register.js"></script>
</body>
</html>
